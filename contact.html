<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <title>Marioclub - Contact</title>
     
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <a href="index.html">
        <p class="site-title">Marioclub</p>
      </a>
    </header>
    <section class="banner">
      <img src="img/banner.webp" alt="Mario holding a question block" />
      <div class="welcome">
        <h1>
          Get in Touch with <br />
          Marioclub
        </h1>
      </div>
    </section>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Join the club</a></li>
        <li><a href="news.html">Latest news</a></li>
        <li><a href="games.html">New games</a></li>
        <li>
          <a href="contact.html" class="join" aria-current="page">Contact</a>
        </li>
      </ul>
    </nav>
    <main>
      <article>
        <h2>Get in touch with me, Mario</h2>
        <form>
          <label for="firstname">First name</label>
          <input
            type="text"
            id="firstname"
            name="fname"
            autocomplete="given-name"
            placeholder="Type Firstname"
            required
          />

          <label for="lastname">Last name</label>
          <input
            type="text"
            id="lastname"
            name="lname"
            autocomplete="family-name"
            placeholder="Type Lastname"
            required
          />

          <br />

          <label for="contact-email">Email address</label>
          <input
            type="email"
            id="contact-email"
            name="mail"
            autocomplete="email"
            placeholder="Type Email"
            required
          />

          <label for="country">Country</label>
          <input
            list="countries"
            name="country"
            id="country"
            autocomplete="country-name"
          />

          <datalist id="countries">
              <option value="Albania"></option>
              <option value="Austria"></option>
              <option value="Belgium"></option>
              <option value="United Kingdom"></option>
          </datalist>

          <br />

          <label for="question">Your question</label>

          <textarea
            id="question"
            name="question"
            rows="4"
            cols="40"
            placeholder="Ask a question..."
          ></textarea>

          <input type="submit" value="Get in Touch" />
        </form>
      </article>
      <ul class="images">
        <li>
          <img
            src="img/thumb-1.webp"
            alt="Mario running through a colorful game world"
            loading="lazy"
          />
        </li>
        <li>
          <img
            src="img/thumb-2.webp"
            alt="Mario exploring an underwater game world"
            loading="lazy"
          />
        </li>
      </ul>
    </main>
    <section class="join">
      <h2>Contact Us today!</h2>
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis
        dignissimos minus voluptatem.
      </p>
      <form>
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />

        <button type="submit">Join the club</button>
      </form>
    </section>
    <footer>
      <p class="copyright">Copyright 2019 Marioclub</p>
    </footer>
  </body>
</html>
